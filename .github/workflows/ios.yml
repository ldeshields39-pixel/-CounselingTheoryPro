name: iPhone simulator build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build local and cloud configurations
        run: |
          set -e
          for configuration in Debug Cloud; do
            xcodebuild -project CounselingTheoryPro.xcodeproj -scheme CounselingTheoryPro -configuration "$configuration" -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
          done
